name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # better-sqlite3 is a native C++ addon that must be compiled for the
      # exact Node.js ABI on this runner.  Install build tools first.
      - name: Install native build tools
        run: sudo apt-get install -y python3 build-essential

      - name: Install dependencies
        run: npm install

      # Force a source compile of the native addon for the exact runtime ABI.
      # --build-from-source bypasses any cached prebuild (.node file that was
      # compiled for a different Node version) and guarantees the binary matches
      # the Node 22 ABI installed above.  Without this, better-sqlite3 causes
      # SIGSEGV in vitest worker forks on ubuntu-latest.
      - name: Rebuild better-sqlite3 from source
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Generate fixture data
        run: npm run generate:data

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
